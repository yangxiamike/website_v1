  faqs:
    - question: What information should I provide for a valve quotation?
      answer: Please provide valve type, size, pressure rating, body material, connection type, medium, working temperature, quantity and required standard.
    - question: Do you support OEM or private label packing?
      answer: Yes. We can support OEM marking, neutral packing and customer label requirements after specification confirmation.

